# For running birdlisten on a dev laptop exactly as the fleet runs it.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose run --rm -e LOOP_ONCE=1 -e RUN_ARGS="--check" app      # config + ffmpeg + model
#   docker compose run --rm -e LOOP_ONCE=1 -e RUN_ARGS="--dry-run" app    # one pass, writes nothing
#   docker compose run --rm -e LOOP_ONCE=1 app                            # one real stream window (~45 s for 4 cameras)
#   docker compose run --rm -e LOOP_ONCE=1 -e RUN_ARGS="--report 7" app   # what was heard this week
#   docker compose up                                                      # the real loop
#
# Not used by the fleet host; it has its own compose.yaml listing every app.
services:
  app:
    build: .
    image: ghcr.io/joekraemer/birdlisten:dev
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
      # Stream mode: main() runs until the container stops, and a 1 s interval
      # restarts it quickly after a fatal error. Round-robin: back-to-back passes.
      LOOP_INTERVAL: "1"
      LOOP_JITTER: "0"
    volumes:
      - birdlisten-data:/data
    # Collage page for Home Assistant. Set SERVE_PORT=8085 in .env and
    # uncomment; then: curl -s localhost:8085/api/recent | head -c 300
    # ports:
    #   - "8085:8085"
    restart: "no"

volumes:
  birdlisten-data:
