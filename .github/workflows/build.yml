# Build the container image, test it, and only then publish it to GHCR as
# ghcr.io/<owner>/<repo>:main. The fleet host pulls that tag every 10 minutes,
# so "push to main" IS the deploy, and a failing test keeps the old image in
# place. Pull requests build and test only.
#
# Also pushes :sha-<short> so a bad release can be pinned back in
# fleet/compose.yaml by changing one tag.
#
# Platforms: linux/amd64 only (the A1708 is Intel). To also run on a Raspberry
# Pi / Apple Silicon, add linux/arm64 to `platforms` and uncomment the QEMU
# step; Python-only images build fine under emulation, just slower.
name: build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # - uses: docker/setup-qemu-action@v3      # only for arm64 cross-builds
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=pr

      # Build once into the runner's local Docker so the tests below run on
      # the exact image, and only push it if they pass. The push step reuses
      # this build's cache, so it does not rebuild.
      - name: Build (for testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: birdlisten:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke test: the image must at least start and import the app. Catches
      # a broken lockfile or a bad module name before the fleet pulls it.
      # pipefail: without it the step takes `tail`'s exit code and never fails.
      - name: Smoke test
        run: |
          set -o pipefail
          docker run --rm -e LOOP_ONCE=1 -e RUN_ARGS="--help" birdlisten:test 2>&1 | tail -20

      # The image's real ffmpeg cuts a 7 s test tone into segments through the
      # exact stream-mode flags. Fails the build if segmenting is broken.
      - name: Segment muxer self-test
        run: docker run --rm --entrypoint python birdlisten:test stream.py --selftest

      # The HEALTHCHECK script is in the image and runs. With SERVE_PORT unset
      # it must pass; pointed at a port nothing listens on it must fail.
      - name: Healthcheck script
        run: |
          docker run --rm --entrypoint python birdlisten:test healthcheck.py
          if docker run --rm -e SERVE_PORT=1 --entrypoint python birdlisten:test healthcheck.py; then
            echo "healthcheck passed with no server listening"; exit 1
          fi

      # Only reached when all tests passed. Pull requests stop here.
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
